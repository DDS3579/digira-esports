    />
    <link rel="icon" type="image/x-icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Chakra+Petch:wght@400;500;600;700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #05070d;
        --ink: #f2f7ff;
        --muted: #8c96ad;
        --neon-blue: #00c8ff;
        --neon-purple: #9b3dff;
        --font-display: "Anton", Impact, sans-serif;
        --font-ui: "Chakra Petch", system-ui, sans-serif;
        --font-mono: "Share Tech Mono", monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background:
          radial-gradient(
              560px circle at 20% 10%,
              rgba(0, 200, 255, 0.1),
              transparent 65%
            ),
          radial-gradient(
            500px circle at 85% 90%,
            rgba(155, 61, 255, 0.1),
            transparent 65%
          ),
          var(--bg);
        color: var(--ink);
        font-family: var(--font-ui);
        text-align: center;
        padding: 32px;
      }
      .code {
        font-family: var(--font-display);
        font-size: clamp(84px, 22vw, 180px);
        line-height: 1;
        letter-spacing: 0.04em;
        background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-family: var(--font-mono);
        font-size: 15px;
        letter-spacing: 0.32em;
        color: var(--neon-blue);
        text-transform: uppercase;
      }
      p {
        max-width: 460px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
      }
      .ctas {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
        margin-top: 6px;
      }
      .btn {
        font-family: var(--font-mono);
        font-size: 11px;
        letter-spacing: 0.22em;
        text-decoration: none;
        padding: 13px 22px;
        border: 1px solid var(--neon-blue);
        color: var(--neon-blue);
        clip-path: polygon(
          10px 0,
          100% 0,
          100% calc(100% - 10px),
          calc(100% - 10px) 100%,
          0 100%,
          0 10px
        );
        transition:
          background 0.2s ease,
          color 0.2s ease;
      }
      .btn:hover {
        background: var(--neon-blue);
        color: var(--bg);
      }
      .btn.solid {
        background: var(--neon-blue);
        color: var(--bg);
      }
      .btn.solid:hover {
        background: var(--neon-purple);
        border-color: var(--neon-purple);
      }
      a.legal {
        margin-top: 18px;
        font-family: var(--font-mono);
        font-size: 10px;
        letter-spacing: 0.2em;
        color: var(--muted);
        text-decoration: none;
      }
      a.legal:hover {
        color: var(--neon-blue);
      }
    </style>
  </head>
  <body>
    <div class="code">404</div>
    <h1>// Signal Lost</h1>
    <p>
      This page doesn't exist — wrong drop point. Your squad is still waiting
      at base.
    </p>
    <div class="ctas">
      <a class="btn solid" href="/">RETURN TO BASE</a>
      <a class="btn" href="/events/mythical-battlegrounds-s2.html"
        >MYTHICAL BATTLEGROUNDS S2.0</a
      >
      <a class="btn" href="https://discord.gg/JtH8SkgnPu" target="_blank" rel="noopener"
        >JOIN DISCORD</a
      >
    </div>
    <a class="legal" href="/">DIGIRA ESPORTS — KATHMANDU, NEPAL</a>
  </body>
</html>
